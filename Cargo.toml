[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
openh264 = "0.9.8"
screenshots = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Devices_Geolocation",
    "Foundation",
]}

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-location = { version = "0.3.2", features = [
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDate", "NSObject", "NSRunLoop"] }
