name: Windows Agent Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build agent
        run: cargo build --release --bin agent --target x86_64-pc-windows-msvc

      - name: Upload Windows agent
        uses: actions/upload-artifact@v4
        with:
          name: gbos-agent-windows-x64
          path: target/x86_64-pc-windows-msvc/release/agent.exe
